[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wpfy"
version = "1.0.0rc5"
description = "Docker-first CLI for WordPress server administration"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
wpfy = "wpfy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wpfy = ["panel_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
