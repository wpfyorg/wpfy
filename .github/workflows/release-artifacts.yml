name: Release artifacts

# Manual only. This workflow is exported to the public repository and must be
# dispatched there. Ordinary pushes never publish a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing public version tag (for example v1.0.0-rc8)"
        required: true
        type: string
      channel:
        description: "Signed channel pointer to update"
        required: true
        type: choice
        options:
          - stable
          - rc
      sequence:
        description: "Externally assigned monotonic sequence; never use run_number"
        required: true
        type: string
      generated_at:
        description: "UTC manifest generation timestamp, YYYY-MM-DDTHH:MM:SSZ"
        required: true
        type: string
      expires_at:
        description: "UTC manifest expiry timestamp, YYYY-MM-DDTHH:MM:SSZ"
        required: true
        type: string

concurrency:
  group: release-artifacts-${{ inputs.channel }}-${{ inputs.sequence }}
  cancel-in-progress: false

# Build job gets no write permission or signing secret. Signing/publication is
# isolated behind the protected `release` environment in the second job.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_SEQUENCE: ${{ inputs.sequence }}
      RELEASE_GENERATED_AT: ${{ inputs.generated_at }}
      RELEASE_EXPIRES_AT: ${{ inputs.expires_at }}
      RELEASE_REPOSITORY: ${{ vars.WPFY_RELEASE_REPOSITORY }}
    steps:
      - name: Check out exact public tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require public repository, configuration, and tags
        run: |
          set -euo pipefail
          for name in RELEASE_TAG RELEASE_CHANNEL RELEASE_SEQUENCE RELEASE_GENERATED_AT RELEASE_EXPIRES_AT RELEASE_REPOSITORY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is not configured; refusing release" >&2
              exit 1
            fi
          done
          [[ "${RELEASE_REPOSITORY}" == "${GITHUB_REPOSITORY}" ]] || {
            echo "::error::workflow must execute in ${RELEASE_REPOSITORY}; cross-repository github.token writes are forbidden" >&2
            exit 1
          }
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(a|b|rc)[0-9]+)?$ ]] || {
            echo "::error::release tag is not a canonical V1 tag" >&2
            exit 1
          }
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          [[ "${tag_commit}" == "$(git rev-parse HEAD)" ]] || {
            echo "::error::checked-out ref is not exactly ${RELEASE_TAG}" >&2
            exit 1
          }
          # Alias tags are immutable bootstrap anchors. Their release assets
          # are updated only after a newly signed pointer passes validation.
          git rev-parse --verify "refs/tags/${RELEASE_CHANNEL}^{commit}" >/dev/null || {
            echo "::error::public channel tag ${RELEASE_CHANNEL} is absent; bootstrap it before dispatch" >&2
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Build wheel and unsigned manifest
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps \
            'build==1.3.0' 'setuptools==75.8.0' 'wheel==0.45.1' \
            'packaging==24.2' 'pyproject-hooks==1.2.0'
          rm -rf dist/release
          mkdir -p dist/release
          python -m build --wheel --no-isolation --outdir dist/release
          mapfile -t wheels < <(find dist/release -maxdepth 1 -type f -name '*.whl' -print)
          [[ "${#wheels[@]}" -eq 1 ]] || {
            echo "::error::expected exactly one wheel, found ${#wheels[@]}" >&2
            exit 1
          }
          manifest_script="scripts/release_manifest.py"
          if [[ -f .github/release/release_manifest.py ]]; then
            manifest_script=.github/release/release_manifest.py
          fi
          python "${manifest_script}" generate \
            --wheel "${wheels[0]}" \
            --tag "${RELEASE_TAG}" \
            --channel "${RELEASE_CHANNEL}" \
            --sequence "${RELEASE_SEQUENCE}" \
            --base-url "https://github.com/${RELEASE_REPOSITORY}/releases/download" \
            --generated-at "${RELEASE_GENERATED_AT}" \
            --expires-at "${RELEASE_EXPIRES_AT}" \
            --output dist/release/manifest.json
          python "${manifest_script}" validate \
            --manifest dist/release/manifest.json \
            --wheel "${wheels[0]}" \
            --tag "${RELEASE_TAG}" \
            --channel "${RELEASE_CHANNEL}" \
            --sequence "${RELEASE_SEQUENCE}" \
            --base-url "https://github.com/${RELEASE_REPOSITORY}/releases/download" \
            --require-unexpired

      - name: Upload unsigned build for protected signing job
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: wpfy-release-input-${{ github.run_id }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 1

  sign-and-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_SEQUENCE: ${{ inputs.sequence }}
      RELEASE_REPOSITORY: ${{ vars.WPFY_RELEASE_REPOSITORY }}
      RELEASE_GPG_FINGERPRINT: ${{ vars.WPFY_RELEASE_GPG_FINGERPRINT }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.WPFY_RELEASE_GPG_PRIVATE_KEY }}
      TRUST_ANCHOR_FINGERPRINT: 9D6F1EE9B1162B410FDE04B38A71ABDD2CCD5FDE
      GH_TOKEN: ${{ github.token }}
    steps:
      # Use workflow_sha, not the release tag, for validator code in the
      # protected job. The wheel and manifest remain untrusted build inputs.
      - name: Check out trusted workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download unsigned build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wpfy-release-input-${{ github.run_id }}
          path: dist/release

      - name: Require signing configuration and public repository
        run: |
          set -euo pipefail
          for name in RELEASE_TAG RELEASE_CHANNEL RELEASE_SEQUENCE RELEASE_REPOSITORY RELEASE_GPG_FINGERPRINT RELEASE_GPG_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is not configured; refusing signing/publication" >&2
              exit 1
            fi
          done
          [[ "${RELEASE_REPOSITORY}" == "${GITHUB_REPOSITORY}" ]] || {
            echo "::error::signing job refuses cross-repository github.token publication" >&2
            exit 1
          }
          [[ "${RELEASE_GPG_FINGERPRINT}" =~ ^[0-9A-Fa-f]{40}$ ]] || {
            echo "::error::WPFY_RELEASE_GPG_FINGERPRINT must be 40 hex characters" >&2
            exit 1
          }
          configured="$(printf '%s' "${RELEASE_GPG_FINGERPRINT}" | tr '[:lower:]' '[:upper:]')"
          [[ "${configured}" == "${TRUST_ANCHOR_FINGERPRINT}" ]] || {
            echo "::error::configured signer is not approved WPFY primary trust anchor" >&2
            exit 1
          }

      - name: Import signing key and match primary fingerprint
        env:
          GNUPGHOME: ${{ runner.temp }}/wpfy-release-gnupg
        run: |
          set -euo pipefail
          install -d -m 700 "${GNUPGHOME}"
          printf '%s' "${RELEASE_GPG_PRIVATE_KEY}" | gpg --batch --import
          configured="$(printf '%s' "${RELEASE_GPG_FINGERPRINT}" | tr '[:lower:]' '[:upper:]')"
          primary="$(gpg --batch --with-colons --list-secret-keys "${configured}" \
            | awk -F: '$1 == "fpr" {print toupper($10); exit}')"
          [[ "${primary}" == "${configured}" ]] || {
            echo "::error::imported signing key primary fingerprint mismatch" >&2
            exit 1
          }
          gpg --batch --with-colons --list-secret-keys "${configured}" \
            | grep -q '^sec:' || {
              echo "::error::configured fingerprint has no private primary key" >&2
              exit 1
            }

      - name: Validate current manifest and signed prior channel pointer
        env:
          GNUPGHOME: ${{ runner.temp }}/wpfy-release-gnupg
        run: |
          set -euo pipefail
          manifest_script="scripts/release_manifest.py"
          if [[ -f .github/release/release_manifest.py ]]; then
            manifest_script=.github/release/release_manifest.py
          fi
          mapfile -t wheels < <(find dist/release -maxdepth 1 -type f -name '*.whl' -print)
          [[ "${#wheels[@]}" -eq 1 ]] || {
            echo "::error::protected job expected exactly one wheel" >&2
            exit 1
          }
          python "${manifest_script}" validate \
            --manifest dist/release/manifest.json \
            --wheel "${wheels[0]}" \
            --tag "${RELEASE_TAG}" \
            --channel "${RELEASE_CHANNEL}" \
            --sequence "${RELEASE_SEQUENCE}" \
            --base-url "https://github.com/${RELEASE_REPOSITORY}/releases/download" \
            --require-unexpired

          previous_dir="${RUNNER_TEMP}/previous-channel"
          mkdir -p "${previous_dir}"
          response="${RUNNER_TEMP}/previous-channel-response"
          if gh api --repo "${RELEASE_REPOSITORY}" --include \
              "repos/${RELEASE_REPOSITORY}/releases/tags/${RELEASE_CHANNEL}" >"${response}" 2>&1; then
            gh release download "${RELEASE_CHANNEL}" --repo "${RELEASE_REPOSITORY}" \
              --pattern manifest.json --pattern manifest.json.asc --dir "${previous_dir}"
            [[ -s "${previous_dir}/manifest.json" && -s "${previous_dir}/manifest.json.asc" ]] || {
              echo "::error::existing channel release lacks signed pointer assets" >&2
              exit 1
            }
            previous_status="${RUNNER_TEMP}/previous-channel-status"
            gpg --batch --status-fd=1 --verify \
              "${previous_dir}/manifest.json.asc" "${previous_dir}/manifest.json" >"${previous_status}"
          python - "${previous_status}" "${RELEASE_GPG_FINGERPRINT}" <<'PY'
          import sys
          expected = sys.argv[2].upper()
          valid = False
          for line in open(sys.argv[1], encoding="utf-8"):
              fields = line.split()
              if len(fields) >= 3 and fields[0] == "[GNUPG:]" and fields[1] == "VALIDSIG":
                  # Field 2 is signing-key fingerprint; final field is
                  # primary fingerprint when a signing subkey was used.
                  valid |= fields[2].upper() == expected or fields[-1].upper() == expected
          if not valid:
              raise SystemExit("prior channel pointer was not signed by approved primary key")
          PY
            python "${manifest_script}" validate \
              --manifest "${previous_dir}/manifest.json" \
              --channel "${RELEASE_CHANNEL}" \
              --require-unexpired
            python "${manifest_script}" validate \
              --manifest dist/release/manifest.json \
              --channel "${RELEASE_CHANNEL}" \
              --previous-manifest "${previous_dir}/manifest.json" \
              --require-unexpired
          else
            grep -qE '^HTTP/[^ ]+ 404([[:space:]]|$)' "${response}" || {
              echo "::error::could not determine prior channel pointer state" >&2
              cat "${response}" >&2
              exit 1
            }
          fi

      - name: Detach-sign exact manifest bytes
        env:
          GNUPGHOME: ${{ runner.temp }}/wpfy-release-gnupg
        run: |
          set -euo pipefail
          trap 'rm -rf "${GNUPGHOME}"' EXIT
          gpg --batch --yes --armor --detach-sign \
            --local-user "${RELEASE_GPG_FINGERPRINT}!" \
            --output dist/release/manifest.json.asc \
            dist/release/manifest.json
          status_file="${RUNNER_TEMP}/manifest-signature-status"
          gpg --batch --status-fd=1 --verify \
            dist/release/manifest.json.asc dist/release/manifest.json >"${status_file}"
          python - "${status_file}" "${RELEASE_GPG_FINGERPRINT}" <<'PY'
          import sys
          expected = sys.argv[2].upper()
          valid = False
          for line in open(sys.argv[1], encoding="utf-8"):
              fields = line.split()
              if len(fields) >= 3 and fields[0] == "[GNUPG:]" and fields[1] == "VALIDSIG":
                  valid |= fields[2].upper() == expected or fields[-1].upper() == expected
          if not valid:
              raise SystemExit("new manifest signature is not from approved primary key")
          PY

      - name: Publish versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t wheels < <(find dist/release -maxdepth 1 -type f -name '*.whl' -print)
          version="$(python -c 'import json; print(json.load(open("dist/release/manifest.json"))["release"]["version"])')"
          gh release create "${RELEASE_TAG}" \
            --repo "${RELEASE_REPOSITORY}" --verify-tag --draft \
            --title "wpfy ${version}" \
            --notes "Secure CLI Updater V1 versioned artifacts for ${RELEASE_TAG}."
          gh release upload "${RELEASE_TAG}" --repo "${RELEASE_REPOSITORY}" \
            "${wheels[0]}" dist/release/manifest.json dist/release/manifest.json.asc
          gh release edit "${RELEASE_TAG}" --repo "${RELEASE_REPOSITORY}" --draft=false

      - name: Publish signed stable or rc channel pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_CHANNEL}" --repo "${RELEASE_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_CHANNEL}" --repo "${RELEASE_REPOSITORY}" \
              --clobber dist/release/manifest.json dist/release/manifest.json.asc
            gh release edit "${RELEASE_CHANNEL}" --repo "${RELEASE_REPOSITORY}" --draft=false
          else
            gh release create "${RELEASE_CHANNEL}" --repo "${RELEASE_REPOSITORY}" \
              --verify-tag --draft \
              --title "wpfy ${RELEASE_CHANNEL} channel" \
              --notes "Signed Secure CLI Updater V1 ${RELEASE_CHANNEL} pointer."
            gh release upload "${RELEASE_CHANNEL}" --repo "${RELEASE_REPOSITORY}" \
              dist/release/manifest.json dist/release/manifest.json.asc
            gh release edit "${RELEASE_CHANNEL}" --repo "${RELEASE_REPOSITORY}" --draft=false
          fi
