name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: pip install -e . pytest

      - name: "Install fail2ban (matches prod: ubuntu-24.04 -> fail2ban 1.0.2)"
        run: sudo apt-get update && sudo apt-get install -y fail2ban

      - name: Live fail2ban-regex validation of rendered WPFY filters
        # Closes the t20 blind spots: fail2ban-client -t passes on string-only
        # parse, and the local (macOS) skip hid the failure-id group check.
        # fail2ban-regex exercises the real 1.0 FailRegex compilation.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          from wpfy import fail2ban_host

          def panel_record(**kw):
              payload = {
                  "timestamp": "2026-08-06T12:00:00Z",
                  "event": "panel_auth_failure",
                  "surface": "password",
                  "client_ip": "203.0.113.8",
                  "account_hash": "sha256:" + "a" * 64,
                  "reason_class": "invalid_credentials",
              }
              payload.update(kw)
              return json.dumps(payload, ensure_ascii=True, separators=(",", ":"))

          def wp_record(**kw):
              payload = {
                  "timestamp": "2026-08-06T12:00:00Z",
                  "event": "wordpress_auth_failure",
                  "site": "shield-a.example.com",
                  "surface": "wp_login",
                  "client_ip": "203.0.113.9",
                  "account_hash": "0" * 64,
                  "reason_class": "soft",
              }
              payload.update(kw)
              return json.dumps(payload, ensure_ascii=True, separators=(",", ":"))

          with tempfile.TemporaryDirectory() as td:
              d = Path(td)

              filters = {
                  "wpfy-panel-auth": fail2ban_host.panel_filter_content(),
                  "wpfy-wordpress": fail2ban_host.wordpress_filter_content(),
                  "wpfy-wordpress-auth": fail2ban_host.wordpress_auth_filter_content(),
              }
              for name, content in filters.items():
                  (d / f"{name}.conf").write_text(content, encoding="utf-8")

              valid = {
                  "wpfy-panel-auth": (
                      [panel_record(client_ip="203.0.113.8"),
                       panel_record(client_ip="2001:db8::1")],
                      2,
                  ),
                  "wpfy-wordpress-auth": (
                      [wp_record(client_ip="203.0.113.9"),
                       wp_record(client_ip="2001:db8::2", surface="xmlrpc")],
                      2,
                  ),
                  # Combined filter: backstop nginx access-log line + strict
                  # JSONL event line each match once.
                  "wpfy-wordpress": (
                      ['203.0.113.9 - - [06/Aug/2026:12:00:00 +0000] "POST /wp-login.php HTTP/1.1" 401 0 "-" "curl"',
                       wp_record()],
                      2,
                  ),
              }
              invalid = {
                  "wpfy-panel-auth": [
                      panel_record(client_ip="0.0.0.0"),
                      panel_record(event="panel_auth_success"),
                      '{"timestamp":"2026-08-06T12:00:00Z","event":"panel_auth_failure"',
                  ],
                  "wpfy-wordpress-auth": [
                      wp_record(client_ip="0.0.0.0"),
                      wp_record(event="panel_auth_failure"),
                      "not json at all",
                  ],
              }

              def run_regex(name, lines):
                  log = d / f"{name}.log"
                  log.write_text("\n".join(lines) + "\n", encoding="utf-8")
                  proc = subprocess.run(
                      ["fail2ban-regex", str(log), str(d / f"{name}.conf")],
                      capture_output=True,
                      text=True,
                  )
                  assert proc.returncode == 0, f"{name}: {proc.stderr}"
                  match = re.search(r"Failregex:\s*(\d+)\s+total", proc.stdout)
                  assert match, f"{name}: no Failregex total in output:\n{proc.stdout}"
                  return int(match.group(1))

              for name, (lines, expected) in valid.items():
                  total = run_regex(name, lines)
                  assert total == expected, f"{name}: expected {expected} matches, got {total}"

              for name, lines in invalid.items():
                  total = run_regex(name, lines)
                  assert total == 0, f"{name}: expected 0 matches, got {total}"

          print("live fail2ban-regex validation passed for all WPFY filters")
          PY

      - name: Run test suite
        run: pytest
